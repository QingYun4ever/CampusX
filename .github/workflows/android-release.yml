name: 发布 Android APK

on:
  push:
    tags: ['android-release/v[0-9]*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 验签并上传到 GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME#android-release/}
          version=${tag#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          name="campusx-android-$version.apk"
          oid=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object | select(.type == "tag") | .sha')
          [[ $oid =~ ^[a-f0-9]{40}$ ]] || { echo '需要已推送的注释版本标签。'; exit 1; }
          annotation=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$oid" --jq '.message | split("\n")[0]')
          sha=${annotation#SHA256: }
          [[ $sha =~ ^[a-f0-9]{64}$ ]] || { echo '安装包 SHA-256 无效。'; exit 1; }
          # 临时分支只用来经 GitHub 交接 APK；主分支和版本标签不包含二进制。
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$name?ref=android-apk/$tag" > "$name"
          printf '%s  %s\n' "$sha" "$name" | sha256sum --check
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then sdkmanager 'build-tools;35.0.0'; fi
          certs=$("$tools/apksigner" verify --print-certs "$name")
          grep -Fxq 'Signer #1 certificate SHA-256 digest: c154762c8d441a5e083f9b29c83c6fa02ae520611e2af62b2b38b4f30d392bc2' <<< "$certs"
          badging=$("$tools/aapt" dump badging "$name")
          [[ $badging == "package: name='com.tongxuequan.app'"*"versionName='$version'"* ]]
          manifest=$("$tools/aapt" dump xmltree "$name" AndroidManifest.xml)
          grep -Eq 'usesCleartextTraffic.*0x0$' <<< "$manifest"
          if grep -Eq 'debuggable.*0xffffffff$' <<< "$manifest"; then
            echo '不能发布调试包。'
            exit 1
          fi
          printf '%s  %s\n' "$sha" "$name" > "$name.sha256"
          gh release create "$tag" "$name" "$name.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "校墙 $tag" --notes '已签名的 Android 安装包，正式版仅支持 HTTPS。'
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/android-apk/$tag"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME"
