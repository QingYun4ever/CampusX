name: 发布 Android APK

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 下载并校验已签名的 APK
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          name="campusx-android-$version.apk"
          mapfile -t metadata < <(git for-each-ref --format='%(contents)' "$GITHUB_REF")
          url=${metadata[0]:-}
          sha=${metadata[1]:-}
          url=${url#APK: }
          sha=${sha#SHA256: }
          [[ $url =~ ^https://tmpfiles\.org/[A-Za-z0-9]+/[A-Za-z0-9._-]+\.apk$ && $sha =~ ^[a-f0-9]{64}$ ]] || {
            echo '标签需要 APK 下载地址和 SHA256。请见 README。'
            exit 1
          }
          page=$(curl --fail --silent --show-error --proto '=https' --max-time 20 --max-filesize 1048576 -- "$url")
          link_pattern='https://tmpfiles\.org/dl/[0-9]+\.[a-f0-9]+/[A-Za-z0-9]+/[A-Za-z0-9._-]+\.apk'
          [[ $page =~ $link_pattern ]]
          direct=${BASH_REMATCH[0]}
          [[ $direct == "https://tmpfiles.org/dl/"*"/${url#https://tmpfiles.org/}" ]]
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 120 --referer "$url" --output "$name" -- "$direct"
          printf '%s  %s\n' "$sha" "$name" | sha256sum --check
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then sdkmanager 'build-tools;35.0.0'; fi
          certs=$("$tools/apksigner" verify --print-certs "$name")
          grep -Fxq 'Signer #1 certificate SHA-256 digest: c154762c8d441a5e083f9b29c83c6fa02ae520611e2af62b2b38b4f30d392bc2' <<< "$certs"
          badging=$("$tools/aapt" dump badging "$name")
          [[ $badging == "package: name='com.tongxuequan.app'"*"versionName='$version'"* ]]
          manifest=$("$tools/aapt" dump xmltree "$name" AndroidManifest.xml)
          grep -Eq 'usesCleartextTraffic.*0x0$' <<< "$manifest"
          if grep -Eq 'debuggable.*0xffffffff$' <<< "$manifest"; then
            echo '不能发布调试包。'
            exit 1
          fi
          printf '%s  %s\n' "$sha" "$name" > "$name.sha256"

      - name: 上传到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="campusx-android-${GITHUB_REF_NAME#v}.apk"
          gh release create "$GITHUB_REF_NAME" "$name" "$name.sha256" --verify-tag \
            --title "校墙 $GITHUB_REF_NAME" --notes '已签名的 Android 安装包，正式版仅支持 HTTPS。'
