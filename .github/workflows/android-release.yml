name: 发布 Android APK

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 校验已签名的 APK
        shell: bash
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          name="campusx-android-$version.apk"
          annotation=$(git for-each-ref --format='%(contents:subject)' "$GITHUB_REF")
          sha=${annotation#SHA256: }
          if [[ $annotation != 'SHA256: '* ]]; then exit 0; fi
          [[ $sha =~ ^[a-f0-9]{64}$ ]] || { echo '安装包 SHA-256 无效。'; exit 1; }
          # 临时分支只用来经 GitHub 交接 APK；主分支和版本标签不包含二进制。
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$name?ref=android-apk/$GITHUB_REF_NAME" > "$name"
          printf '%s  %s\n' "$sha" "$name" | sha256sum --check
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then sdkmanager 'build-tools;35.0.0'; fi
          certs=$("$tools/apksigner" verify --print-certs "$name")
          grep -Fxq 'Signer #1 certificate SHA-256 digest: c154762c8d441a5e083f9b29c83c6fa02ae520611e2af62b2b38b4f30d392bc2' <<< "$certs"
          badging=$("$tools/aapt" dump badging "$name")
          [[ $badging == "package: name='com.tongxuequan.app'"*"versionName='$version'"* ]]
          manifest=$("$tools/aapt" dump xmltree "$name" AndroidManifest.xml)
          grep -Eq 'usesCleartextTraffic.*0x0$' <<< "$manifest"
          if grep -Eq 'debuggable.*0xffffffff$' <<< "$manifest"; then
            echo '不能发布调试包。'
            exit 1
          fi
          printf '%s  %s\n' "$sha" "$name" > "$name.sha256"
          printf 'filename=%s\n' "$name" >> "$GITHUB_OUTPUT"

      - name: 上传到 GitHub Releases
        if: steps.apk.outputs.filename != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_FILE: ${{ steps.apk.outputs.filename }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_FILE" "$APK_FILE.sha256" --verify-tag \
            --title "校墙 $GITHUB_REF_NAME" --notes '已签名的 Android 安装包，正式版仅支持 HTTPS。'
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/android-apk/$GITHUB_REF_NAME"
