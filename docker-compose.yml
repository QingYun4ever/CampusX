# 校墙 Docker 部署。用法见 README「Docker 部署」
services:
  app:
    build: .
    image: xiaoqiang:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # 仅在可信 Nginx 反代后面启用，以便按访客 IP 限流
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - data:/data
    ports:
      # HTTPS 由宿主机的 Nginx 处理
      - "127.0.0.1:${APP_PORT:-3000}:3000"
volumes:
  data:
